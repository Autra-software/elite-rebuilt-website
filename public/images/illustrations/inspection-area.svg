<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Illustration of a vehicle in the inspection area with an inspection checklist</title>
  <defs>
    <g id="car">
      <path d="M10 70 L18 48 Q22 40 32 38 L80 34 L118 8 Q124 4 132 4 L212 4 Q222 4 228 10 L262 38 L290 42 Q302 44 302 56 L302 78 Q302 84 296 84 L16 84 Q10 84 10 78 Z" fill="#FFFFFF" stroke="#0E1A2E" stroke-width="4" stroke-linejoin="round"/>
      <path d="M92 36 L124 12 L168 12 L168 36 Z" fill="#E4EBF2" stroke="#0E1A2E" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M178 12 L216 12 Q220 12 223 15 L245 36 L178 36 Z" fill="#E4EBF2" stroke="#0E1A2E" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="172" y1="40" x2="172" y2="80" stroke="#0E1A2E" stroke-width="2.5"/>
      <rect x="286" y="50" width="12" height="9" rx="2" fill="#B6E43A"/>
      <circle cx="75" cy="84" r="22" fill="#0E1A2E"/>
      <circle cx="75" cy="84" r="9" fill="#D5DCE4"/>
      <circle cx="240" cy="84" r="22" fill="#0E1A2E"/>
      <circle cx="240" cy="84" r="9" fill="#D5DCE4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#F1F4F7"/>

  <!-- back wall: roll-up door -->
  <rect x="60" y="70" width="440" height="310" fill="#FFFFFF" stroke="#0E1A2E" stroke-width="5"/>
  <g stroke="#D5DCE4" stroke-width="4">
    <line x1="64" y1="110" x2="496" y2="110"/>
    <line x1="64" y1="150" x2="496" y2="150"/>
    <line x1="64" y1="190" x2="496" y2="190"/>
    <line x1="64" y1="230" x2="496" y2="230"/>
    <line x1="64" y1="270" x2="496" y2="270"/>
    <line x1="64" y1="310" x2="496" y2="310"/>
    <line x1="64" y1="350" x2="496" y2="350"/>
  </g>

  <!-- ceiling lights -->
  <g fill="#0E1A2E">
    <rect x="120" y="22" width="120" height="14" rx="4"/>
    <rect x="320" y="22" width="120" height="14" rx="4"/>
  </g>
  <g fill="#B6E43A" opacity="0.5">
    <rect x="130" y="36" width="100" height="5" rx="2"/>
    <rect x="330" y="36" width="100" height="5" rx="2"/>
  </g>

  <!-- floor -->
  <rect x="0" y="380" width="800" height="220" fill="#D5DCE4"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#0E1A2E" stroke-width="5"/>
  <!-- inspection bay outline -->
  <path d="M40 560 L120 410 L470 410 L540 560" fill="none" stroke="#0E1A2E" stroke-width="5" stroke-dasharray="18 14" stroke-linecap="round"/>

  <!-- car in the bay -->
  <use href="#car" transform="translate(85 330) scale(1.3)"/>

  <!-- clipboard -->
  <g transform="rotate(-5 645 300)">
    <rect x="555" y="130" width="180" height="250" rx="10" fill="#0E1A2E"/>
    <rect x="570" y="152" width="150" height="214" rx="4" fill="#FFFFFF"/>
    <rect x="612" y="118" width="66" height="28" rx="6" fill="#B6E43A" stroke="#0E1A2E" stroke-width="4"/>
    <g stroke="#0E1A2E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="586" y="176" width="24" height="24" rx="3"/>
      <path d="M591 188 L597 194 L607 181"/>
      <rect x="586" y="226" width="24" height="24" rx="3"/>
      <path d="M591 238 L597 244 L607 231"/>
      <rect x="586" y="276" width="24" height="24" rx="3"/>
      <path d="M591 288 L597 294 L607 281"/>
      <rect x="586" y="326" width="24" height="24" rx="3"/>
    </g>
    <g stroke="#8A96A8" stroke-width="5" stroke-linecap="round">
      <line x1="624" y1="188" x2="700" y2="188"/>
      <line x1="624" y1="238" x2="690" y2="238"/>
      <line x1="624" y1="288" x2="704" y2="288"/>
      <line x1="624" y1="338" x2="680" y2="338"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
