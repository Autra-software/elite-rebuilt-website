<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Illustration of a vehicle title, parts receipts and an approval stamp</title>
  <rect width="800" height="600" fill="#F1F4F7"/>

  <!-- title document -->
  <g transform="rotate(-5 300 300)">
    <rect x="160" y="110" width="290" height="380" rx="6" fill="#FFFFFF" stroke="#0E1A2E" stroke-width="5"/>
    <rect x="160" y="110" width="290" height="62" rx="6" fill="#0E1A2E"/>
    <rect x="160" y="150" width="290" height="22" fill="#0E1A2E"/>
    <text x="305" y="152" text-anchor="middle" font-family="Archivo, Arial, Helvetica, sans-serif" font-weight="800" font-size="28" letter-spacing="4" fill="#FFFFFF">TITLE</text>
    <g stroke="#8A96A8" stroke-width="7" stroke-linecap="round">
      <line x1="190" y1="210" x2="420" y2="210"/>
      <line x1="190" y1="245" x2="380" y2="245"/>
      <line x1="190" y1="280" x2="410" y2="280"/>
      <line x1="190" y1="315" x2="350" y2="315"/>
    </g>
    <rect x="190" y="350" width="230" height="40" rx="4" fill="#E4EBF2" stroke="#0E1A2E" stroke-width="3"/>
    <g stroke="#0E1A2E" stroke-width="4" stroke-linecap="round">
      <line x1="190" y1="450" x2="300" y2="450"/>
    </g>
  </g>

  <!-- receipt -->
  <g transform="rotate(7 560 320)">
    <path d="M470 140 H650 V470 L635 458 L620 470 L605 458 L590 470 L575 458 L560 470 L545 458 L530 470 L515 458 L500 470 L485 458 L470 470 Z" fill="#FFFFFF" stroke="#0E1A2E" stroke-width="5" stroke-linejoin="round"/>
    <g stroke="#8A96A8" stroke-width="6" stroke-linecap="round">
      <line x1="495" y1="185" x2="625" y2="185"/>
      <line x1="495" y1="225" x2="580" y2="225"/>
      <line x1="600" y1="225" x2="625" y2="225"/>
      <line x1="495" y1="260" x2="570" y2="260"/>
      <line x1="600" y1="260" x2="625" y2="260"/>
      <line x1="495" y1="295" x2="585" y2="295"/>
      <line x1="600" y1="295" x2="625" y2="295"/>
    </g>
    <line x1="495" y1="335" x2="625" y2="335" stroke="#0E1A2E" stroke-width="4" stroke-dasharray="8 8"/>
    <line x1="495" y1="372" x2="560" y2="372" stroke="#0E1A2E" stroke-width="7" stroke-linecap="round"/>
    <line x1="590" y1="372" x2="625" y2="372" stroke="#0E1A2E" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- approval stamp -->
  <g transform="rotate(-12 420 430)">
    <circle cx="420" cy="430" r="62" fill="#B6E43A" fill-opacity="0.25" stroke="#0E1A2E" stroke-width="6"/>
    <circle cx="420" cy="430" r="48" fill="none" stroke="#0E1A2E" stroke-width="3"/>
    <path d="M396 432 L413 449 L446 410" fill="none" stroke="#0E1A2E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- pen -->
  <g transform="rotate(38 640 470)">
    <rect x="560" y="458" width="190" height="24" rx="12" fill="#0E1A2E"/>
    <rect x="690" y="452" width="46" height="8" rx="3" fill="#B6E43A"/>
    <path d="M560 458 L528 470 L560 482 Z" fill="#C9D2DC" stroke="#0E1A2E" stroke-width="3" stroke-linejoin="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
