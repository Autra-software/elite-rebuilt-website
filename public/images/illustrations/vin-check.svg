<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Illustration of a vehicle identification number being checked with a magnifying glass</title>
  <rect width="800" height="600" fill="#F1F4F7"/>

  <!-- windshield and dashboard -->
  <path d="M0 0 H800 V250 Q400 200 0 250 Z" fill="#E4EBF2"/>
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="120" y1="60" x2="220" y2="160"/>
    <line x1="170" y1="50" x2="240" y2="120"/>
  </g>
  <path d="M0 250 Q400 200 800 250 V600 H0 Z" fill="#0E1A2E"/>
  <path d="M0 250 Q400 200 800 250" fill="none" stroke="#1C2B44" stroke-width="16"/>

  <!-- VIN plate on the dashboard -->
  <rect x="120" y="300" width="560" height="88" rx="8" fill="#C9D2DC" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="142" cy="344" r="6" fill="#8A96A8"/>
  <circle cx="658" cy="344" r="6" fill="#8A96A8"/>
  <text x="400" y="358" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="40" letter-spacing="4" fill="#0E1A2E">1HGCM82633A004352</text>
  <text x="124" y="290" text-anchor="start" font-family="Archivo, Arial, Helvetica, sans-serif" font-weight="800" font-size="22" letter-spacing="3" fill="#B6E43A">VIN</text>

  <!-- magnifying glass -->
  <line x1="640" y1="440" x2="735" y2="545" stroke="#0E1A2E" stroke-width="34" stroke-linecap="round"/>
  <line x1="640" y1="440" x2="735" y2="545" stroke="#B6E43A" stroke-width="22" stroke-linecap="round"/>
  <circle cx="575" cy="355" r="92" fill="#FFFFFF" fill-opacity="0.18" stroke="#0E1A2E" stroke-width="24"/>
  <circle cx="575" cy="355" r="92" fill="none" stroke="#B6E43A" stroke-width="12"/>
  <path d="M522 306 A68 68 0 0 1 590 286" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
