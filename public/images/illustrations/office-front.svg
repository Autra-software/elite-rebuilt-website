  <circle cx="242" cy="245" r="22" fill="none" stroke="#B6E43A" stroke-width="4"/>
  <path d="M231 246 L239 254 L254 236" fill="none" stroke="#B6E43A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="280" y="256" font-family="Archivo, Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">ELITE REBUILT</text>

  <!-- window with blinds -->
