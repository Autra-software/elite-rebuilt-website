  <line x1="290" y1="310" x2="290" y2="470" stroke="#0E1A2E" stroke-width="4"/>

  <!-- door -->
  <rect x="440" y="306" width="116" height="164" fill="#0E1A2E"/>
  <rect x="456" y="322" width="84" height="96" fill="#33455F"/>
  <rect x="526" y="390" width="8" height="30" rx="3" fill="#B6E43A"/>

  <!-- unit number -->
  <rect x="578" y="316" width="58" height="44" rx="4" fill="#0E1A2E"/>
  <text x="607" y="347" text-anchor="middle" font-family="Archivo, Arial, Helvetica, sans-serif" font-weight="800" font-size="26" fill="#B6E43A">22</text>

  <!-- car parked in front -->
