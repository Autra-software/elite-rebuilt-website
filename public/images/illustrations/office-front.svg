  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <line x1="40" y1="500" x2="20" y2="585"/>
    <line x1="330" y1="500" x2="320" y2="585"/>
    <line x1="620" y1="500" x2="630" y2="585"/>
  </g>

  <!-- palm -->
  <g transform="translate(-34 0)"><path d="M705 470 C700 400 712 330 728 260" fill="none" stroke="#0E1A2E" stroke-width="12" stroke-linecap="round"/>
  <g fill="none" stroke="#0E1A2E" stroke-width="6" stroke-linecap="round">
    <path d="M728 260 C700 235 670 235 646 252"/>
    <path d="M728 260 C710 220 690 205 662 200"/>
    <path d="M728 260 C740 215 760 200 786 198"/>
    <path d="M728 260 C760 245 784 250 800 268"/>
    <path d="M728 260 C726 225 734 200 746 182"/>
  </g></g>

