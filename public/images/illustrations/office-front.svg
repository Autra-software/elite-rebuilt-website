      <path d="M92 36 L124 12 L168 12 L168 36 Z" fill="#E4EBF2" stroke="#0E1A2E" stroke-width="4" stroke-linejoin="round"/>
      <path d="M178 12 L216 12 Q220 12 223 15 L245 36 L178 36 Z" fill="#E4EBF2" stroke="#0E1A2E" stroke-width="4" stroke-linejoin="round"/>
